<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PickPilot AI — Demo tour</title><style>body{margin:0;font:16px system-ui;background:#132c39;color:#eef6f7}main{max-width:1000px;margin:auto;padding:28px}h1{margin-bottom:5px}p{line-height:1.6;color:#ccdedf}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}button{padding:12px 18px;border:0;border-radius:8px;background:#ddf4eb;color:#14382f;cursor:pointer}img{display:block;max-width:100%;max-height:72vh;margin:auto;object-fit:contain;border-radius:9px;background:white}small{color:#a6c5c7}</style><main><small>WAREHOUSE OPERATIONS / SYNTHETIC DATA PROTOTYPE</small><h1>◈ PickPilot AI</h1><p id="caption"></p><nav><button id="prev">← Previous</button><button id="play">Play tour</button><button id="next">Next →</button><span id="count"></span></nav><img id="screen" alt=""><p><small>Actual app screenshots. This is a screenshot walkthrough, not a screen recording. Live API behavior has not been tested with a real key. Read DEMO.md for a 90-second narration script.</small></p></main><script>
const slides=[['01-overview.jpg','Operations overview: inspect available stock, replenishment risk, pick exceptions and slow movers.'],['02-query.jpg','Ask inventory: run an example and inspect the executed SQL and answer. Demo mode uses fixed templates; Live LLM is optional.'],['03-risk.jpg','Stockout risk: review seven-day model estimates with inventory context and global feature importance.'],['04-slotting.jpg','Slotting and routes: inspect capacity-checked proposals and modeled route distances before supervisor review.'],['05-validation.jpg','Validation: inspect the temporal holdout, baseline comparison and the limits of synthetic evidence.']];let index=0,timer;const screen=document.querySelector('#screen'),caption=document.querySelector('#caption'),count=document.querySelector('#count');function render(){screen.src='screenshots/'+slides[index][0];screen.alt=slides[index][1];caption.textContent=slides[index][1];count.textContent=(index+1)+' / '+slides.length}function step(n){index=(index+n+slides.length)%slides.length;render()}document.querySelector('#next').onclick=()=>step(1);document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#play').onclick=function(){if(timer){clearInterval(timer);timer=null;this.textContent='Play tour'}else{timer=setInterval(()=>step(1),8000);this.textContent='Pause tour'}};document.onkeydown=e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)};render();
</script></html>
